[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "portfolio-rag-api"
version = "0.1.0"
description = "Oracle-hosted RAG API and knowledge synchronization worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=5.1,<6"]
observability = ["sentry-sdk[fastapi]>=2.20,<3"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
portfolio-rag-api = "app.main:run"
portfolio-rag-worker = "worker.main:run"
portfolio-rag-evaluate = "evaluation.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker", "evaluation"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
